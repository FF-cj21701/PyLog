<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant - Intelligent Log Analysis</title>
    <!-- Highlight.js for syntax highlighting -->
    <link rel="stylesheet" href="highlight.css">
    <link rel="stylesheet" href="chat_styles.css">
    <script src="highlight.min.js"></script>
    <!-- Marked.js for Markdown parsing -->
    <script src="marked.min.js"></script>
    <!-- QWebChannel for communication -->
    <script src="qwebchannel.js"></script>
    <style id="dynamic-theme-vars">
        /* This will be populated dynamically by Python */
    </style>
</head>

<body>
    <div id="mention-popover" class="mention-popover">
        <div class="popover-header">
            <div class="popover-title" id="popover-title">
                <svg class="tag-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
                    <polyline points="13 2 13 9 20 9"></polyline>
                </svg>
                <span>Metadata Details</span>
            </div>
            <div class="popover-close">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </div>
        </div>
        <div class="popover-body" id="popover-body">
            <!-- Content will be injected -->
        </div>
    </div>
    <div class="toolbar">
        <div class="toolbar-left">
            <div class="toolbar-brand">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
                </svg>
                AI Assistant
            </div>
            <div id="model-display">Loading...</div>
            <div id="context-info" class="context-info context-tag"></div>
        </div>
        <div class="toolbar-right">
            <button class="icon-btn" id="mode-btn" data-tooltip="Reasoning Mode" aria-label="Reasoning Mode">
                <svg class="icon" viewBox="0 0 24 24">
                    <path
                        d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7zm2.85 11.1l-.85.6V16h-4v-2.3l-.85-.6A4.997 4.997 0 0 1 7 9c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.63-.8 3.16-2.15 4.1z" />
                </svg>
            </button>
            <button class="icon-btn" id="settings-btn" data-tooltip="Settings" aria-label="Settings">
                <svg class="icon" viewBox="0 0 24 24">
                    <path
                        d="M12 15.5A3.5 3.5 0 0 1 8.5 12A3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5a3.5 3.5 0 0 1-3.5 3.5M19.43 12.97C19.47 12.65 19.5 12.33 19.5 12C19.5 11.67 19.47 11.34 19.43 11L21.54 9.37C21.73 9.22 21.78 8.95 21.66 8.73L19.66 5.27C19.54 5.05 19.27 4.96 19.05 5.05L16.56 6.05C16.04 5.66 15.5 5.32 14.87 5.07L14.5 2.42C14.46 2.18 14.25 2 14 2H10C9.75 2 9.54 2.18 9.5 2.42L9.13 5.07C8.5 5.32 7.96 5.66 7.44 6.05L4.95 5.05C4.73 4.96 4.46 5.05 4.34 5.27L2.34 8.73C2.21 8.95 2.27 9.22 2.46 9.37L4.57 11C4.53 11.34 4.5 11.67 4.5 12C4.5 12.33 4.53 12.65 4.57 12.97L2.46 14.63C2.27 14.78 2.21 15.05 2.34 15.27L4.34 18.73C4.46 18.95 4.73 19.03 4.95 18.95L7.44 17.94C7.96 18.34 8.5 18.68 9.13 18.93L9.5 21.58C9.54 21.82 9.75 22 10 22H14C14.25 22 14.46 21.82 14.5 21.58L14.87 18.93C15.5 18.67 16.04 18.34 16.56 17.94L19.05 18.95C19.27 19.03 19.54 18.95 19.66 18.73L21.66 15.27C21.78 15.05 21.73 14.78 21.54 14.63L19.43 12.97Z" />
                </svg>
            </button>
            <button class="icon-btn" id="clear-chat-btn" data-tooltip="Clear Chat" aria-label="Clear Chat">
                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" />
                </svg>
            </button>
        </div>
    </div>

    <div id="chat-container" class="message-container">
        <!-- Messages will appear here -->
    </div>

    <!-- Explicit task plan progress area -->
    <div class="plan-progress-container" id="planProgressContainer">
        <div class="plan-progress-content" id="planProgressContent">
            <div class="plan-progress-card">
                <ul class="plan-progress-list" id="topPlanProgressList">
                </ul>
            </div>
        </div>
        <div class="plan-progress-header" id="planProgressHeader">
            <h3>Task Plan Progress</h3>
            <div class="plan-progress-stats" id="topPlanProgressStats"></div>
            <button class="collapse-btn" id="planProgressCollapseBtn">&#9660;</button>
        </div>
    </div>

    <div class="input-container">
        <div id="mention-menu" class="mention-menu"></div>
        <div id="context-tags-container" class="context-tags-container">
            <!-- Tags will be added here -->
        </div>
        <div class="input-wrapper">
            <div class="input-header">
                <div id="message-input" contenteditable="true" placeholder="Ask AI Assistant..." role="textbox"
                    aria-multiline="true">
                </div>
            </div>
            <div class="input-footer">
                <div class="footer-left">
                    <button class="footer-btn" title="Add File">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                    </button>
                </div>
                <div class="footer-right">
                    <button id="send-btn" class="send-btn" disabled>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script src="chat_bootstrap.js"></script>
    <script src="chat_tools.js"></script>
    <script src="chat_details.js"></script>
    <script src="chat_plan.js"></script>
    <script src="chat_input.js"></script>
    <script src="chat_message.js"></script>
</body>

</html>
