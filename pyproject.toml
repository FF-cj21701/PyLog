[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pylog"
version = "1.0.0"
description = "AI-powered well log visualization and petrophysical analysis platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "PyLog Contributors"}
]
keywords = ["well-log", "petrophysics", "visualization", "geoscience", "DLIS", "AI"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/cj21701/PyLog"
Repository = "https://github.com/cj21701/PyLog"
Issues = "https://github.com/cj21701/PyLog/issues"

[tool.setuptools]
packages = ["pylog_api"]
